    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Kill any stale service workers (e.g. from old Replit hosting) that intercept module requests with wrong MIME types -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var killed = registrations.length > 0;
          registrations.forEach(function(reg) { reg.unregister(); });
          if (killed && !sessionStorage.getItem('sw_cleared')) {
            sessionStorage.setItem('sw_cleared', '1');
            // Clear all caches too
            if (window.caches) {
              caches.keys().then(function(keys) {
                keys.forEach(function(key) { caches.delete(key); });
              });
            }
            window.location.reload();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
